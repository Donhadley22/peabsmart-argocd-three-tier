apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: peabsmart-dev
  namespace: argocd
spec:
  project: peabsmart-lab
  source:
    repoURL: https://github.com/Donhadley22/peabsmart-argocd-three-tier.git
    targetRevision: main
    path: gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
