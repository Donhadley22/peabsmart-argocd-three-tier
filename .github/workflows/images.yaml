name: Build Peabsmart images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/images.yaml'
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute lower case registry owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/peabsmart-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com
      - uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/peabsmart-frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com
